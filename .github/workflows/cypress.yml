name: Cypress Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'

jobs:
  cypress-test:
    runs-on: ubuntu-22.04

    services:
      mysql:
        image: mysql:8.0
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: archiviumtest
          MYSQL_USER: testuser
          MYSQL_PASSWORD: testpassword

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build:all

      - name: Wait for MySQL
        run: |
          for i in {30..0}; do
            if mysqladmin ping -h 127.0.0.1 --silent; then
              break
            fi
            echo 'Waiting for MySQL...'
            sleep 1
          done

      - name: Setup database
        run: yes | npm run db:reset
        env:
          DEV_MODE: true
          ARCHIVIUM_DB_HOST: localhost
          ARCHIVIUM_DB_USER: testuser
          ARCHIVIUM_DB_PASSWORD: testpassword
          ARCHIVIUM_DB: archiviumtest

      - name: Cypress run
        uses: cypress-io/github-action@v6
        with:
          start: npm start
          # Use an IPv4 literal: probing "localhost" makes newer Node try ::1 and 127.0.0.1 together, and while
          # the server is still starting that fails with an error the action doesn't retry, so it gives up at once.
          wait-on: 'http://127.0.0.1:33004'
        env:
          PORT: 33004
          HOCUSPOCUS_PORT: 31234
          PROVIDER_ADDRESS: ws://localhost:31234
          DOMAIN: dev.archivium.net
          DEV_MODE: true
          SENDGRID_API_KEY: 
          OPENAI_API_KEY: 
          WEB_PUSH_ENABLED: 

          ARCHIVIUM_DB_HOST: localhost
          ARCHIVIUM_DB_USER: testuser
          ARCHIVIUM_DB_PASSWORD: testpassword
          ARCHIVIUM_DB: archiviumtest
