name: Cypress Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'

jobs:
  cypress-test:
    runs-on: ubuntu-22.04

    env:
      PORT: 33004
      HOCUSPOCUS_PORT: 31234
      PROVIDER_ADDRESS: ws://localhost:31234
      DOMAIN: dev.archivium.net
      DEV_MODE: true
      SENDGRID_API_KEY:
      OPENAI_API_KEY:
      WEB_PUSH_ENABLED:

      ARCHIVIUM_DB_HOST: localhost
      ARCHIVIUM_DB_USER: testuser
      ARCHIVIUM_DB_PASSWORD: testpassword
      ARCHIVIUM_DB: archiviumtest

    services:
      mysql:
        image: mysql:8.0
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: archiviumtest
          MYSQL_USER: testuser
          MYSQL_PASSWORD: testpassword

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build:all

      - name: Wait for MySQL
        run: |
          for i in {30..0}; do
            if mysqladmin ping -h 127.0.0.1 --silent; then
              break
            fi
            echo 'Waiting for MySQL...'
            sleep 1
          done

      - name: Setup database
        run: yes | npm run db:reset

      # The server is started and awaited here rather than through the Cypress action's start/wait-on:
      # since the runner image update, the action's wait step aborts instantly with "Socket closed before
      # the connection was established", before it has even launched the server.
      - name: Start server
        run: nohup npm start > server.log 2>&1 &

      - name: Wait for server
        run: |
          for i in $(seq 60); do
            if curl -sf -o /dev/null http://127.0.0.1:33004/; then
              echo "Server is up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo 'Server did not start within 60s. Server log:'
          cat server.log
          exit 1

      - name: Cypress run
        uses: cypress-io/github-action@v6
        with:
          # Dependencies and the Cypress binary were installed above; re-running npm ci here
          # would also swap node_modules out from under the running server.
          install: false

      - name: Server log
        if: always()
        run: cat server.log || true
